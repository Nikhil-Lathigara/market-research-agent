version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nikhil Lathigara", email = "nikhilsoni1209@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "crewai-tools[mcp]>=1.15.33",
    "crewai[google-genai]>=1.15.33",
    "google-api-python-client>=2.202.0",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "mcp[cli]>=1.28,<2",
    "pydantic>=2.12.5",
    "pytest>=9.2.0",
